# Managed by XO Launchpad for app rupeeflow-xo-ow321ab. Edits are overwritten when the app is reconnected.
name: Launchpad rupeeflow-xo-ow321ab

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  IMAGE: registry.xo.builders/rupeeflow-xo-ow321ab/app

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: registry.xo.builders
          username: ${{ secrets.LAUNCHPAD_RUPEEFLOW_XO_OW321AB_REGISTRY_USERNAME }}
          password: ${{ secrets.LAUNCHPAD_RUPEEFLOW_XO_OW321AB_REGISTRY_PASSWORD }}

      # Optional build-time variables: repository secret ENV_VARS (KEY=value lines), handed to the
      # build as the secret file `env_file`. Runtime variables are set in Launchpad, not here.
      # Written outside the build context, so a `COPY . .` can never bake it into an image layer.
      - name: Build-time env file
        env:
          ENV_VARS: ${{ secrets.ENV_VARS }}
        run: printf '%s\n' "$ENV_VARS" > "$RUNNER_TEMP/launchpad.env"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          secret-files: |
            env_file=${{ runner.temp }}/launchpad.env
